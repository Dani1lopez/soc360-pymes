name: Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # The generated types are committed, so a stale snapshot must fail here
      # instead of surfacing as a type error in a later pull request.
      - name: Check the generated API types are up to date
        working-directory: frontend
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/types.ts

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Check formatting
        working-directory: frontend
        run: pnpm format:check

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build
