# Product stack — the whole system in one file.
#
#   ./scripts/demo_bootstrap.py                                        # once
#   docker compose -f docker-compose.app.yml up --build
#
# The project name is explicit on purpose. Without it Compose would derive it
# from the directory name, which is the same project as the development stack,
# and the shared service names (worker, beat) would make Compose recreate the
# development containers with this configuration instead of leaving them alone.
name: soc360-app
#
# Why a separate file instead of docker-compose.yml: that one keeps local
# infrastructure behind profiles (postgres for dev, postgres-test and toxiproxy
# for tests) and docker-compose.worker.yml is the development worker overlay,
# which requires .env.worker. Keeping this stack apart leaves both workflows
# untouched, at the cost of repeating the postgres and redis definitions.
#
# Credentials are never written here. They are read from .env, which
# `scripts/demo_bootstrap.py` fills in, and only ever appear interpolated inside
# a connection URL or a command argument. Run that script first: without it the
# application refuses to start, because its settings require those values.
#
# TWO DATABASE ROLES, AND THIS IS NOT OPTIONAL:
#   soc360_migration — owns the schema and runs the migrations
#   soc360_app       — the application role, NOSUPERUSER NOBYPASSRLS
# PostgreSQL skips row level security for a superuser or for a role with
# BYPASSRLS. If the application connected as the owner, every policy would be
# ignored, tenant isolation would silently stop protecting anything, and
# nothing would fail visibly.

services:
  # The owner role and its password come from .env; only the role name is
  # overridden, because .env carries the development stack's name.
  postgres:
    image: postgres:16-alpine
    container_name: soc360_app_postgres
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: soc360_migration
      POSTGRES_DB: ${APP_DB_NAME:-soc360}
      # Read by docker/postgres-init/10-roles.sh, on first start only.
      APP_DB_USER: soc360_app
    volumes:
      - soc360_app_postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc360_migration -d ${APP_DB_NAME:-soc360}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # No env_file: the container needs no credential of its own. Compose
  # interpolates the required value into the command and the healthcheck.
  redis:
    image: redis:7-alpine
    container_name: soc360_app_redis
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Applies the schema and exits. The API and the worker never serve or consume
  # work before this completes, so the schema can never be half applied, and a
  # broken migration is a failed service instead of an API crash loop.
  migrate:
    build:
      context: .
      target: runtime
    entrypoint: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL_MIGRATION: ${STACK_DB_MIGRATION_DSN}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    # entrypoint.sh runs `gunicorn app.main:app --config gunicorn_conf.py "$@"`,
    # so these are appended to that command. Binding 0.0.0.0 is required: the
    # Gunicorn default (127.0.0.1) would be unreachable from the nginx container.
    command: ["--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "60"]
    env_file:
      - path: .env
        required: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # The application role, never the schema owner: this is what keeps row
      # level security in force.
      DATABASE_URL: ${STACK_DB_DSN}
      DATABASE_URL_MIGRATION: ${STACK_DB_MIGRATION_DSN}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    # No published port on purpose: nginx reaches the API over the internal
    # network, so the only public entry point is the frontend. To debug it,
    # `docker compose -f docker-compose.app.yml exec api curl -s localhost:8000`.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file:
      - path: .env
        required: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${STACK_DB_DSN}
      DATABASE_URL_MIGRATION: ${STACK_DB_MIGRATION_DSN}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Secure by default. Turn these on in .env only for a local demo: see
      # docs/operations/demo-scan.md.
      SCAN_EXECUTION_ENABLED: ${SCAN_EXECUTION_ENABLED:-false}
      SCAN_DEMO_MODE: ${SCAN_DEMO_MODE:-false}
      ENRICHMENT_ENABLED: ${ENRICHMENT_ENABLED:-false}
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    # Do not enable no-new-privileges: it disables Nmap's file capabilities.
    read_only: true
    tmpfs: [/tmp]
    init: true
    pids_limit: ${WORKER_PIDS_LIMIT:-256}
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    cpus: ${WORKER_CPUS:-1.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Reaps scans that outlived their deadline and pumps the queue. Without it a
  # scan interrupted by a restart stays "running" forever.
  beat:
    build:
      context: .
      target: runtime
    user: "65534:65534"
    entrypoint:
      ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    env_file:
      - path: .env
        required: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${STACK_DB_DSN}
      DATABASE_URL_MIGRATION: ${STACK_DB_MIGRATION_DSN}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    init: true
    # Exactly one beat: two beats double every schedule.
    deploy:
      replicas: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Demo data, behind a profile so a plain 'up' stays empty of fixtures. It
  # gives the UI somebody to log in as: without it the application is usable in
  # theory and unusable in practice. Pair it with docker-compose.demo.yml, which
  # contributes the target the demo scan points at:
  #   docker compose -f docker-compose.app.yml -f docker-compose.demo.yml --profile demo up -d
  seed:
    profiles: [demo]
    build:
      context: .
      target: runtime
    entrypoint: ["python", "scripts/seed_db.py"]
    env_file:
      - path: .env
        required: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${STACK_DB_DSN}
      POSTGRES_USER: soc360_migration
      POSTGRES_DB: ${APP_DB_NAME:-soc360}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    build:
      context: ./frontend
    ports:
      # 8088 rather than 80 or 8080: those are commonly taken on a developer
      # machine (macOS ships an Apache listening on 8080).
      - "${APP_HTTP_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  soc360_app_postgres:
