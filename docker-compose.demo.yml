services:
  demo-target:
    profiles: [demo]
    build:
      context: ./docker/demo-target
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 80), timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
