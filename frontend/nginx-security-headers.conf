# Security headers for static SPA responses only (not proxied /api/ routes,
# where FastAPI's SecurityHeadersMiddleware owns response headers).
# Included in every static location block because nginx drops server-level
# add_header directives whenever a location defines its own add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FBN9rdef7SCtki1IqwYPWpDDSG0du8dHkSpdd3KtSoI='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
