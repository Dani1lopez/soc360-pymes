# Serving rules for the built SPA.
#
# The API is reached through the same origin, so the browser never makes a
# cross-origin request: no CORS configuration is needed, and the HttpOnly,
# SameSite=Strict refresh cookie keeps working exactly as it does in
# development, where the Vite dev server proxies /api the same way.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the text assets nginx serves.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No trailing slash on proxy_pass: the original URI, including /api, is
    # forwarded as-is to the API.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed file names, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy would keep serving the old
    # bundle to returning visitors.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # TanStack Router owns the client-side routes: a deep link such as /scans
    # has to return the SPA shell instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
