[pytest]
addopts = --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    integration: Integration tests requiring real PostgreSQL and Alembic migrations
    toxiproxy: Tests that route Redis traffic through the Toxiproxy fault-injection harness
    redis_pressure: Tests requiring the dedicated disposable real Redis pressure service
    serial_only: Tests that create/drop a fixed-name database or run alembic against the shared unscoped database; unsafe under concurrent xdist workers. Run parallel with -m "not serial_only" and these separately with -m serial_only
    unit: Unit tests using mocks and fakeredis (default, no marker needed)
